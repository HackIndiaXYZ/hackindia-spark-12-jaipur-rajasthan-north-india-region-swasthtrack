<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d7b55">
  <meta name="robots" content="noindex">
  <title>ऑफ़लाइन — SwasthTrack</title>
  <!--
    Static fallback served by public/sw.js when a page cannot be fetched. No data,
    no scripts beyond reload. Colours mirror the tokens in src/app/globals.css.
  -->
  <style>
    :root {
      --canvas: #f5f7f6;
      --surface: #ffffff;
      --line: #e3e8e6;
      --ink: #14201d;
      --ink-muted: #4a5a55;
      --brand: #0d7b55;
      --gold-1: #f6dfa0;
      --gold-line: #e6c976;
      --gold-ink: #6b4a0c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem max(1.5rem, env(safe-area-inset-bottom));
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main {
      width: 100%;
      max-width: 26rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: 0 8px 16px -4px rgba(16, 32, 28, 0.07), 0 20px 40px -10px rgba(16, 32, 28, 0.1);
    }
    img { width: 4rem; height: 4rem; border-radius: 0.75rem; border: 1px solid var(--line); object-fit: cover; }
    h1 { margin: 1rem 0 0; font-size: 1.375rem; line-height: 1.35; }
    h2 { margin: 0.125rem 0 0; font-size: 0.8125rem; font-weight: 500; color: var(--ink-muted); }
    p { margin: 0.875rem 0 0; color: var(--ink-muted); }
    p small { display: block; margin-top: 0.125rem; font-size: 0.75rem; }
    button {
      margin-top: 1.5rem;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      font: inherit;
      font-weight: 600;
      color: var(--gold-ink);
      background: linear-gradient(115deg, var(--gold-1), var(--gold-line));
      border: 0;
      border-radius: 0.75rem;
      box-shadow: 0 1px 2px rgba(16, 32, 28, 0.12), 0 6px 16px -6px rgba(156, 109, 30, 0.5);
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main role="main">
    <img src="/logo.jpg" alt="" width="64" height="64">
    <h1>इंटरनेट नहीं है</h1>
    <h2>You are offline</h2>
    <p>
      आपका पहले से सहेजा हुआ डेटा सुरक्षित है। इंटरनेट लौटते ही यहाँ से आगे बढ़ें।
      <small>Data you saved earlier is safe. New entries cannot be saved until you reconnect.</small>
    </p>
    <button type="button" onclick="location.reload()">फिर कोशिश करें (Try again)</button>
  </main>
  <script>
    // Come back by itself once the connection returns.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
